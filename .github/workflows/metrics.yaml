name: Generate Github Stats Card
on:
  schedule:
    - cron: '0 0 * * *' # UTC时间，每天0点自动执行更新
  workflow_dispatch: # 支持手动点击运行
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate stats svg
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          username: yooongchun
          output: github_metrics.svg
          config: |
            base=on
            commits=on
            languages=on
            prs=on
            issues=on
            calendar=on
            followup=off
            repositories=on
            plugin_contrib_wiki=on
          theme: github-dark

      - name: Commit generated image
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add github_metrics.svg
          git commit -m "auto update stats svg" || echo "No changes to commit"
          git push
